version: '3.8'

services:

  # ── MySQL Database ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: infohub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: infohub_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infohub-network

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infohub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/infohub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: InfoHubSuperSecretKey2026InfoHubSuperSecretKey2026InfoHubSuperSecretKey2026
      JWT_EXPIRATION: 86400000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      HIBP_API_KEY: ${HIBP_API_KEY:-demo-key}
      MAIL_USERNAME: ${MAIL_USERNAME:-demo@infohub.app}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-demopass}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - pdf_storage:/app/pdfs
    networks:
      - infohub-network

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infohub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - infohub-network

volumes:
  mysql_data:
  pdf_storage:

networks:
  infohub-network:
    driver: bridge
