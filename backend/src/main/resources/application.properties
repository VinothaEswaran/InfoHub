# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/infohub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=newpassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=InfoHubSuperSecretKey2026InfoHubSuperSecretKey2026InfoHubSuperSecretKey2026
jwt.expiration=86400000

# OpenAI
openai.api.key=${OPENAI_API_KEY:demo-key}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-3.5-turbo

# HaveIBeenPwned
hibp.api.key=${HIBP_API_KEY:demo-key}
hibp.api.url=https://haveibeenpwned.com/api/v3

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:demo@infohub.app}
spring.mail.password=${MAIL_PASSWORD:demopass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.com.infohub=INFO
logging.level.org.springframework.security=WARN
